
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Show build error summary
        if: failure()
        run: |
          echo "## Build failure details" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -n -A 10 -B 3 -E "What went wrong:|Execution failed for task|e: |error:" build.log | tail -n 100 >> "$GITHUB_STEP_SUMMARY" || tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build log was not created. Check the earlier failed step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
